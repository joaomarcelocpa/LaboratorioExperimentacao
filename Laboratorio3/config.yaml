# Janela de observação — 12 meses, fixada pelo professor.
janela:
  inicio: 2025-10-01
  fim: 2026-09-30

faixas_estrelas:
  - "1000..2000"
  - "2000..5000"
  - "5000..10000"
  - "10000..50000"
  - ">50000"

min_releases: 5
min_runs: 50
n_repos: 100
seed: 42

ambientes_producao: [production, prod, live]
labels_bug: [bug, regression, "type: bug"]
n_dias_issue: 7

# Teto de tentativas anteriores buscadas por run (Issue #41). Um run com 40
# tentativas não pode queimar a cota sozinho; as buscadas são as mais
# recentes, que são as que dizem se a falha foi flaky.
max_tentativas_anteriores: 5

# Mínimo de runs válidos para um mês ter métricas (Issue #42, RQ 08b). Não
# pode ser menor que 5: o contrato de metricas_mensais.csv exige nulo abaixo
# disso.
min_runs_mes: 5

bots:
  - "dependabot[bot]"
  - "renovate[bot]"
  - "github-actions[bot]"
