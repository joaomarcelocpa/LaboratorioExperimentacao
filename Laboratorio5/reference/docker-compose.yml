services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tarefas
      POSTGRES_USER: semente
      POSTGRES_PASSWORD: semente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semente -d tarefas"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/tarefas?user=semente&password=semente
      # P9: o stub dos testes roda no host (porta STUB_PORTA, padrao 9099)
      NOTIFICACAO_URL: http://host.docker.internal:9099/notificacoes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
