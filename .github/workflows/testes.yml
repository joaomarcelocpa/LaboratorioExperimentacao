# O repositório é um monorepo (Laboratorio1..Laboratorio5). Este workflow só
# olha o Laboratorio3, para não ficar vermelho por código das outras entregas.
name: testes

on:
  push:
    paths:
      - 'Laboratorio3/**'
      - '.github/workflows/testes.yml'
  pull_request:
    paths:
      - 'Laboratorio3/**'
      - '.github/workflows/testes.yml'

defaults:
  run:
    working-directory: Laboratorio3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependências
        run: pip install -r requirements.txt
      - name: testes com cobertura
        run: pytest --cov=metricas --cov=coleta --cov-report=term-missing --cov-fail-under=80
      - name: o Makefile parseia
        # make -n só imprime as receitas, sem rodar nada. Pega tab virado em
        # espaço e alvo com nome errado — coisas que nenhum teste de string
        # pegaria, e `make run-docker` é critério de aceite.
        run: |
          make -n test
          make -n run
          make -n run-docker
          make -n reproduce
      - name: checagem de contrato
        # O dicionário de dados é gerado dos schemas: se divergir, o commit
        # esqueceu de regenerá-lo.
        run: |
          python -m metricas.dicionario
          git diff --exit-code docs/dicionario_dados.md

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build da imagem
        run: docker build -t lab03-dora .
